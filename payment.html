<!DOCTYPE html>
<html>
<head><title>Paytm Payment</title></head>
<body>
    <h2>Pay for Premium Services</h2>
    <form method="post" action="/paytm-initiate">
        <input type="text" name="name" placeholder="Your Name" required><br>
        <input type="text" name="email" placeholder="Email" required><br>
        <input type="text" name="mobile" placeholder="Mobile Number" required><br>
        <input type="text" name="amount" value="100" readonly><br>
        <button type="submit">Pay with Paytm</button>
    </form>
</body>
</html>
